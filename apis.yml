- aid: department-of-homeland-security:dhs-open-data-catalog
  name: DHS Open Data Catalog
  description: >-
    The DHS Open Data Catalog publishes datasets across the Department's mission areas (immigration, law
    enforcement, emergency management, cybersecurity, infrastructure protection, screening, and maritime).
    Datasets are also available via Data.gov's CKAN-compatible API.
