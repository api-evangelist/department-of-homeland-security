- aid: department-of-homeland-security:cisa-kev-feed
  name: CISA Known Exploited Vulnerabilities Catalog Feed
  description: >-
    The CISA Known Exploited Vulnerabilities (KEV) catalog is a curated list of vulnerabilities that have
    been actively exploited in the wild. The catalog is published as a JSON and CSV feed by the Cybersecurity
    and Infrastructure Security Agency (CISA), and is mirrored on GitHub for easy programmatic access.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
  baseURL: https://www.cisa.gov/sites/default/files/feeds
  tags:
  - CISA
  - CVE
  - Cybersecurity
  - KEV
  - Vulnerabilities
  properties:
