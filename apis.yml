- aid: department-of-homeland-security:ntas-feed
  name: National Terrorism Advisory System Feed
  description: >-
    The National Terrorism Advisory System (NTAS) feed publishes current terrorism alerts and bulletins
    issued by DHS as XML files. Developers can consume the feed to surface advisory content in their own
    applications and web pages.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
