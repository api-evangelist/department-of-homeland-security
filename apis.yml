apis:
- aid: department-of-homeland-security:uscis-case-status-api
  name: USCIS Case Status API
  description: >-
    The USCIS Case Status API provides programmatic access to the same Case Status Online lookup that
    immigration applicants use, allowing authorized partners to retrieve the current status and history
    of a USCIS case by receipt number. The API uses OAuth 2.0 client credentials and is published through
    the USCIS Developer Portal.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.uscis.gov/api/case-status
  baseURL: https://api.uscis.gov
  tags:
  - Case Status
  - Immigration
  - USCIS
  properties:
  - type: Documentation
    url: https://developer.uscis.gov/api/case-status
  - type: Portal
    url: https://developer.uscis.gov/
  - type: Catalog
    url: https://developer.uscis.gov/apis
  contact:
  - FN: USCIS Developer Support
    url: https://developer.uscis.gov/
- aid: department-of-homeland-security:uscis-foia-api
  name: USCIS FOIA Request and Status API
  description: >-
    The USCIS FOIA Request and Status API allows partners to submit Freedom of Information Act requests
    programmatically and check the status of submitted requests. It is published through the USCIS Developer
    Portal using OAuth 2.0.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.uscis.gov/api/foia-request-and-status
